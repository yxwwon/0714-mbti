<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐱 학교생활 MBTI 정원 테스트</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');


*{
    box-sizing:border-box;
}


body{

    margin:0;
    overflow-x:hidden;

    font-family:'Jua', sans-serif;

    background:
    linear-gradient(#bde9ff,#fff3c9);

}


/* ===== 움직이는 하늘 ===== */

.sky{

    position:fixed;
    width:100%;
    height:100%;

    overflow:hidden;
    z-index:-3;

}


/* 구름 */

.cloud{

    position:absolute;

    width:150px;
    height:50px;

    background:white;

    border-radius:50px;

    opacity:.7;

    animation:cloudMove 25s linear infinite;

}


.cloud:before,
.cloud:after{

    content:"";

    position:absolute;

    background:white;

    border-radius:50%;

}


.cloud:before{

    width:70px;
    height:70px;

    left:25px;
    top:-35px;

}


.cloud:after{

    width:55px;
    height:55px;

    right:20px;
    top:-25px;

}



@keyframes cloudMove{

    from{
        transform:translateX(-200px);
    }

    to{
        transform:translateX(120vw);
    }

}



/* 햇살 */

.sun{

    position:absolute;

    top:60px;
    right:80px;

    width:130px;
    height:130px;

    background:#ffe68a;

    border-radius:50%;

    box-shadow:
    0 0 50px #ffe68a;

    animation:sunPulse 3s infinite;

}



@keyframes sunPulse{

    50%{
        transform:scale(1.1);
    }

}



/* ===== 정원 ===== */


.garden{

    position:fixed;

    bottom:0;

    width:100%;
    height:220px;

    background:
    linear-gradient(#8fd17a,#5eb85c);

    z-index:-2;

}



/* 꽃 */

.flower{

    position:absolute;

    bottom:100px;

    font-size:40px;

    animation:sway 3s infinite;

}



@keyframes sway{

    50%{
        transform:rotate(8deg);
    }

}



/* ===== 고양이 ===== */


.cat-area{

    position:relative;

    height:220px;

}


.cat{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    bottom:10px;

    font-size:110px;

    animation:
    walk 4s infinite,
    bounce 2s infinite;

}



/* 걷기 */

@keyframes walk{


0%,100%{
    transform:translateX(-50%);
}


50%{

    transform:
    translateX(-50%)
    translateY(-15px);

}

}



/* 꼬리 느낌 */

.cat::after{

    content:"〰";

    position:absolute;

    right:-35px;

    bottom:25px;

    font-size:50px;

    animation:tail 1s infinite;

}



@keyframes tail{

    50%{
        transform:rotate(30deg);
    }

}



/* ===== 앱 카드 ===== */


.container{

    width:90%;

    max-width:650px;

    margin:40px auto;

    background:
    rgba(255,255,255,.85);

    backdrop-filter:blur(10px);

    border-radius:40px;

    padding:35px;

    box-shadow:

    0 15px 40px rgba(0,0,0,.15);

    text-align:center;

}



h1{

    color:#ff91b8;

    font-size:38px;

}


.subtitle{

    color:#777;

}



/* 질문 카드 */


.question-box{

    background:#fff7fb;

    padding:30px;

    border-radius:30px;

    margin-top:20px;

}



.question{

    font-size:24px;

    line-height:1.5;

}



/* 선택지 */


.answer{

    width:100%;

    margin:10px 0;

    padding:15px;

    border:none;

    border-radius:25px;

    background:#ffe0ec;

    font-family:inherit;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}


.answer:hover{

    background:#ffb6d3;

    transform:translateY(-5px);

}



/* 결과 */


.result{

    display:none;

}



.mbti{

    font-size:65px;

    color:#ff7eae;

}



.result-card{

    background:#fff2a8;

    border-radius:30px;

    padding:25px;

    font-size:20px;

}



/* 다시하기 */

.restart{

    margin-top:25px;

    padding:15px 30px;

    border:none;

    border-radius:30px;

    background:#91ddff;

    font-family:inherit;

    font-size:18px;

}



/* 반짝이 */

.spark{

    position:fixed;

    color:white;

    animation:sparkle 4s infinite;

}


@keyframes sparkle{

    50%{
        opacity:0;
        transform:translateY(-40px);
    }

}


</style>

</head>


<body>


<!-- 배경 -->


<div class="sky">


<div class="sun"></div>


<div class="cloud" style="top:100px"></div>

<div class="cloud" style="top:220px; animation-delay:8s"></div>


<div class="spark" style="left:20%;top:30%">✦</div>

<div class="spark" style="left:70%;top:40%">✦</div>


</div>



<div class="garden">

<div class="flower" style="left:10%">🌷</div>

<div class="flower" style="left:30%">🌼</div>

<div class="flower" style="left:80%">🌻</div>

</div>




<div class="container">


<div class="cat-area">

<div class="cat">
🐈
</div>

</div>


<h1>
🐾 학교생활 MBTI 정원 테스트
</h1>


<p class="subtitle">
따뜻한 햇살 아래 고양이와 함께 알아보는 나의 학교생활 성향
</p>



<div id="quiz">


<div class="question-box">

<div class="question" id="question">

</div>


<div id="answers">

</div>


</div>


<p id="progress"></p>


</div>




<div class="result" id="result">


<h2>
🌿 너의 학교생활 고양이는?
</h2>


<div class="mbti" id="mbti"></div>


<div class="result-card" id="description">

</div>


<button class="restart" onclick="restart()">

🐱 다시 테스트하기

</button>


</div>



</div>
